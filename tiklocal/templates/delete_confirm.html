{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:720px;">
    <h1 class="title">{{ t('detail.delete_confirm_title', file=file) }}</h1>
    <p class="notification is-warning is-light">{{ t('detail.delete_confirm_copy') }}</p>
    <form method="post">
      {% if auth_enabled %}<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">{% endif %}
      <button type="submit" class="button">{{ t('common.delete') }}</button>
    </form>
  </div>
</section>
{% endblock %}
